spring.application.name=MediTicket02
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/mediticket_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

app.verification.base-url=http://localhost:8080/api/auth/verify

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.invite-expiration-ms=172800000

# Employee invite signup link (frontend route the invite email points to)
app.employee-invite.base-url=http://localhost:8080/signup/employee